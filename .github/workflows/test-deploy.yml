name: Test deployment

on:
  pull_request:
    branches:
      - main
  # Manual run to validate the site against other branches of the framework repositories.
  # Leave an input empty to use the ref pinned in api-sources.json.
  workflow_dispatch:
    inputs:
      cs_ref:
        description: "C# framework ref (branch, tag or commit)"
        required: false
        default: ""
      utilities_ref:
        description: "C# utilities ref (compiled for type resolution)"
        required: false
        default: ""
      ts_ref:
        description: "TypeScript framework ref (branch, tag or commit)"
        required: false
        default: ""

permissions:
  contents: read
  pull-requests: write

jobs:
  test-deploy:
    name: Test deployment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install dependencies
        run: npm ci

      # Clones the C# and TypeScript framework repositories at the refs in api-sources.json,
      # then generates the API reference into api-docs/ (see scripts/).
      - name: Generate API reference
        env:
          SF_CS_REF: ${{ github.event.inputs.cs_ref }}
          SF_CS_UTILITIES_REF: ${{ github.event.inputs.utilities_ref }}
          SF_TS_REF: ${{ github.event.inputs.ts_ref }}
        run: npm run api

      - name: Typecheck
        run: npm run typecheck

      - name: Test build website
        run: npm run build

      - name: Upload site preview
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: site-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
          path: build
          retention-days: 14

      # The GITHUB_TOKEN is read-only for pull requests from forks, so only comment on same-repo PRs.
      - name: Comment with preview instructions
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- site-preview-comment -->';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const artifactUrl = '${{ steps.upload.outputs.artifact-url }}';
            const body = [
              marker,
              '### Site preview',
              '',
              `Built from ${context.sha.slice(0, 7)}. Download the [site-pr-${context.issue.number} artifact](${artifactUrl}) from the [workflow run](${runUrl}), unzip it, then run:`,
              '',
              '```',
              'npx serve -s build',
              '```',
              '',
              'The artifact expires after 14 days. Every push to this PR replaces it.',
            ].join('\n');

            const {data: comments} = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
